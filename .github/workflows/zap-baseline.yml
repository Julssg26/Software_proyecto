name: OWASP ZAP Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline (pasivo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Baseline: rastreo limitado y análisis pasivo, sin ataques activos.
      # La acción adjunta los reportes HTML, JSON y Markdown como artifact.
      - name: Escanear DonaRed con ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://software-proyecto.vercel.app'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: false
          fail_action: false
          # Un minuto de rastreo; los warnings no generan código de fallo.
          cmd_options: '-m 1 -I'
          artifact_name: donared-zap-baseline-report

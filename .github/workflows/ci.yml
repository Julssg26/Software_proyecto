name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empujan varios commits seguidos a la misma rama/PR, cancela la corrida
# anterior en vez de dejarlas apiladas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas (node:test)
        working-directory: backend
        # JWT_SECRET dummy: las pruebas firman/verifican sus propios tokens y
        # no hablan con una base de datos real (todo Mongoose está mockeado).
        env:
          JWT_SECRET: ci-test-secret-nunca-usar-en-produccion
        run: node --test

  frontend:
    name: Frontend (tipos, lint y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build de producción
        working-directory: frontend
        # Sin VITE_API_URL en CI el build usa el fallback a localhost; no afecta
        # la validez del build, solo el runtime del bundle generado.
        run: npm run build

  # --- Análisis de calidad estático. Se salta automáticamente (sin fallar el
  # pipeline) si el repositorio todavía no tiene configurados los secretos
  # SONAR_TOKEN / SONAR_HOST_URL. Ver docs/ci-cd.md para darlos de alta. ---
  sonarqube:
    name: SonarQube (análisis estático)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo para blame/duplicación

      - name: Comprobar si SonarQube está configurado
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "configured=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Escaneo SonarQube
        if: steps.check.outputs.configured == 'true'
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Sin configurar (informativo)
        if: steps.check.outputs.configured != 'true'
        run: echo "::notice::SONAR_TOKEN no está configurado; se omite el análisis. Ver docs/ci-cd.md."

  # --- Escaneo de seguridad contra el staging desplegado. Requiere el secreto
  # STAGING_URL; se omite (sin fallar) mientras no exista ese entorno. ---
  owasp-zap:
    name: OWASP ZAP (baseline scan)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Comprobar si hay staging configurado
        id: check
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: echo "configured=${{ env.STAGING_URL != '' }}" >> "$GITHUB_OUTPUT"

      - name: Baseline scan
        if: steps.check.outputs.configured == 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_URL }}
          cmd_options: "-a" # incluye reglas pasivas adicionales

      - name: Sin configurar (informativo)
        if: steps.check.outputs.configured != 'true'
        run: echo "::notice::STAGING_URL no está configurado; se omite el escaneo. Ver docs/ci-cd.md."
